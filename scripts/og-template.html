<!doctype html>
<!-- 링크 미리보기 이미지(public/og.png, 1200×630) 원본. README "배포" 절의 명령으로 다시 만들 수 있습니다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@700&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: radial-gradient(900px 500px at 75% -10%, #2a2a2a, transparent 60%), #161616;
    font-family: "IBM Plex Sans KR", sans-serif; position: relative;
  }
  .cover {
    position: absolute; left: 90px; top: 70px; width: 620px; height: 470px; transform: rotate(-3deg);
    background: #c8a575 radial-gradient(rgb(0 0 0 / .05) 1px, transparent 1px) 0 0 / 3px 3px; color: #3b2c18;
    box-shadow: 0 30px 60px -25px rgb(0 0 0 / .8); padding: 34px 40px; box-sizing: border-box;
    display: grid; grid-template-rows: auto 1fr auto;
  }
  .label { font: 500 14px "IBM Plex Mono", monospace; letter-spacing: .14em; text-transform: uppercase; display: flex; justify-content: space-between; }
  canvas { width: 100%; height: 100%; }
  .role { font: 600 22px "IBM Plex Mono", monospace; letter-spacing: .18em; }
  .sheet {
    position: absolute; right: 90px; top: 150px; width: 400px; height: 330px; transform: rotate(5deg);
    background: #f3f1ec; color: #141414; box-shadow: 0 30px 60px -25px rgb(0 0 0 / .8); padding: 28px; box-sizing: border-box;
    font: 500 16px/1.9 "IBM Plex Mono", monospace;
  }
  .sheet b { display: block; border-bottom: 1.5px solid #141414; padding-bottom: 8px; margin-bottom: 14px; letter-spacing: .08em; }
  .sticker { position: absolute; left: 520px; top: 520px; background: #c8f53d; color: #141414; padding: 10px 18px; transform: rotate(-7deg); font: 600 18px "IBM Plex Mono", monospace; letter-spacing: .08em; }
</style>
</head>
<body>
  <div class="cover">
    <div class="label"><span>Vol.01</span><span>2026</span></div>
    <canvas id="c" width="1080" height="560"></canvas>
    <div class="role">BACKEND DEVELOPER</div>
  </div>
  <div class="sheet"><b>TECHNICAL SPECIFICATION</b>Java · Spring Boot<br>JPA · MyBatis<br>MySQL · Redis<br>Docker</div>
  <div class="sticker">GSY-2026-001</div>
  <script>
    document.fonts.ready.then(() => {
      const c = document.getElementById("c"), w = c.width, h = c.height, ctx = c.getContext("2d");
      const o = document.createElement("canvas"); o.width = w; o.height = h;
      const x = o.getContext("2d"); const lines = ["SUYOUNG'S", "PORTFOLIO"];
      let size = h * 0.42; x.font = `700 ${size}px "IBM Plex Sans KR"`;
      const widest = Math.max(...lines.map((l) => x.measureText(l).width)); if (widest > w) { size *= w / widest; x.font = `700 ${size}px "IBM Plex Sans KR"`; }
      x.textBaseline = "middle"; lines.forEach((l, i) => x.fillText(l, 0, h / 2 + (i - 0.5) * size * 1.05));
      const d = x.getImageData(0, 0, w, h).data, step = Math.round(size / 22);
      ctx.fillStyle = "#3b2c18";
      for (let y = step / 2; y < h; y += step) for (let i = step / 2; i < w; i += step)
        if (d[((y | 0) * w + (i | 0)) * 4 + 3] > 110) { ctx.beginPath(); ctx.arc(i, y, step * .34, 0, 7); ctx.fill(); }
    });
  </script>
</body>
</html>
